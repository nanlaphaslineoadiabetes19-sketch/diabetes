<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งเวลาแจ้งเตือนรับประทานยา - Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Sarabun', sans-serif; }
        .nav-bar-fixed { position: fixed; top: 15px; left: 15px; z-index: 999; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; border-radius: 15px 15px 0 0 !important; }
        .form-label { font-weight: 600; color: #495057; }
        .required::after { content: " *"; color: red; }
        .stock-box { border: 2px solid #495057; border-radius: 10px; padding: 15px; background-color: #fff; display: none; }
        .stock-box h6 { font-weight: 600; color: #333; margin-bottom: 15px; }
        
        .meal-section {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 15px 15px; 
            background-color: #ffffff;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-back { padding: 10px 22px; background: rgba(255, 255, 255, 0.8); color: #555; border: 1px solid #ddd; border-radius: 50px; cursor: pointer; font-size: 15px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.1); backdrop-filter: blur(8px); }
        .btn-remove { 
            width: 38px; height: 38px; min-width: 38px; flex-shrink: 0; border-radius: 10px;
            display: inline-flex; align-items: center; justify-content: center; padding: 0;
        }
    </style>
</head>
<body class="p-1 p-sm-3 p-md-4">
    <div class="nav-bar-fixed">
        <button class="btn-back" onclick="goBackMain()">⬅ ย้อนกลับ</button>
    </div>

    <div class="container px-1 px-sm-3" style="max-width: 800px;">
        <div class="card">
            <div class="card-header p-3 p-md-4 text-center">
                <br><br>
                <h2 class="mb-0 fs-5 fs-md-4">💊 ตั้งเวลารับประทานยา</h2>
                <p>ระบบแจ้งเตือนรับประทานยาประจำวัน(รองรับยาหลายชนิด)</p>
            </div>
            
            <div class="card-body px-2 px-sm-4 py-4">
                <form id="medicineForm" onsubmit="saveMedicine(event)">
                    
                    <!-- 1. เลือกรายชื่อ -->
                    <div class="mb-4">
                        <label for="patientSelect" class="form-label required">เลือกรายชื่อผู้ป่วย</label>
                        <select class="form-select form-select-lg fs-6" id="patientSelect" required>
                            <option value="">-- รายชื่อผู้ป่วย... --</option>
                        </select>
                        <input type="hidden" id="line_name">
                    </div>

                    <!-- 2. รายการยาคงเหลือ (ใช้เพื่อดูข้อมูล) -->
                    <div class="stock-box mb-4" id="stockBox">
                        <h6 id="stockHeader">📦 ปริมาณยาที่เหลือ</h6>
                        <div id="stockContent" class="row"></div>
                    </div>

                    <h5 class="fw-bold mb-3 text-primary mt-4">📝 รายการยาที่สั่งจ่าย</h5>
                    
                    <!-- ================= ยามื้อเช้า ================= -->
                    <div class="meal-section">
                        <h5 class="fw-bold text-success mb-3">🌅 ยามื้อเช้า</h5>
                        <div id="morningMedContainer"></div>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addMedRow('morning')">
                            + เพิ่มชนิดยา
                        </button>
                    </div>
                    
                    <!-- ================= ยามื้อกลางวัน ================= -->
                    <div class="meal-section">
                        <h5 class="fw-bold text-success mb-3">☀️ ยามื้อกลางวัน</h5>
                        <div id="lunchMedContainer"></div>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addMedRow('lunch')">
                            + เพิ่มชนิดยา
                        </button>
                    </div>
                    
                    <!-- ================= ยามื้อเย็น ================= -->
                    <div class="meal-section">
                        <h5 class="fw-bold text-success mb-3">🌙 ยามื้อเย็น</h5>
                        <div id="dinnerMedContainer"></div>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addMedRow('dinner')">
                            + เพิ่มชนิดยา
                        </button>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mt-3" style="border-radius: 10px; font-weight: 600; letter-spacing: 1px;">
                        💾 บันทึก
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLuqh2ivMXanbpRRbFfhMeOElAFgyrWBkFOthPZzCTjiI0gWdy7rDXTiuYlpj2Lzyb/exec"; 
        let globalMedicineList = [];

        function addMedRow(mealType) {
            const container = document.getElementById(mealType + 'MedContainer');
            const rowId = 'row-' + Date.now() + Math.floor(Math.random() * 1000);
            let mealCode = mealType === 'morning' ? 'B' : (mealType === 'lunch' ? 'L' : 'D');
            let optionsHtml = '<option value="">เลือกยา</option>';
            
            const filteredMeds = globalMedicineList.filter(med => {
                if (typeof med === 'string') return true; 
                return med.meal && med.meal.includes(mealCode);
            });

            filteredMeds.forEach(med => {
                if (typeof med === 'string') {
                    optionsHtml += `<option value="${med}">${med}</option>`;
                } else {
                    let statusText = med.status === 'before' ? '[ก่อนอาหาร]' : (med.status === 'after' ? '[หลังอาหาร]' : '');
                    optionsHtml += `<option value="${med.name}" data-dose="${med.pills}">${med.name} ${statusText}</option>`;
                }
            });

            const rowHtml = `
                <div class="d-flex align-items-center gap-1 gap-sm-2 mb-2 med-row" id="${rowId}">
                    <div class="flex-grow-1">
                        <select class="form-select med-select" onchange="updateDose(this)">${optionsHtml}</select>
                    </div>
                    <div style="width: 80px; flex-shrink: 0;" title="จำนวน">
                        <input type="number" class="form-control dose-input px-1 text-center" placeholder="จำนวน" min="1" step="1">
                    </div>
                    <button type="button" class="btn btn-danger btn-remove" onclick="document.getElementById('${rowId}').remove()" title="ลบ">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                        </svg>
                    </button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', rowHtml);
        }

        function updateDose(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const doseValue = selectedOption.getAttribute('data-dose');
            const doseInput = selectElement.closest('.med-row').querySelector('.dose-input');
            doseInput.value = doseValue ? doseValue : "";
        }

        function extractMealData(mealType) {
            const container = document.getElementById(mealType + 'MedContainer');
            const rows = container.querySelectorAll('.med-row');
            let medList = [];
            
            rows.forEach(row => {
                const medName = row.querySelector('.med-select').value;
                const pillsInput = row.querySelector('.dose-input').value;
                // แปลงเป็นจำนวนเต็ม หรือปล่อยว่างถ้าไม่ได้กรอก
                const pills = pillsInput !== "" ? parseInt(pillsInput, 10) || 0 : "";
                
                // เก็บทุกแถวที่มีการเลือกชื่อยา (ไม่ตัดทิ้งแม้จำนวนเม็ดจะเป็น 0 หรือว่าง เพื่อรักษาตำแหน่ง Index)
                if (medName) {
                    medList.push({ name: medName, pills: pills });
                } else {
                    medList.push({ name: "", pills: "" });
                }
            });
            return medList;
        }

        async function loadMedicineList() {
            try {
                const response = await fetch(SCRIPT_URL + "?action=getMedicineList");
                const jsonResult = await response.json(); 
                if (Array.isArray(jsonResult)) { globalMedicineList = jsonResult; }
                else if (jsonResult.list && Array.isArray(jsonResult.list)) { globalMedicineList = jsonResult.list; }
                
                addMedRow('morning'); addMedRow('lunch'); addMedRow('dinner');
            } catch (error) { console.error("โหลดรายการยาไม่สำเร็จ", error); }
        }

        async function loadPatients() {
            try {
                const response = await fetch(SCRIPT_URL + "?action=getPatients");
                const patients = await response.json();
                const select = document.getElementById("patientSelect");
                patients.forEach(p => select.appendChild(new Option(p.line_name, p.line_id)));
            } catch (error) { console.error(error); }
        }

        document.getElementById("patientSelect").addEventListener("change", async function() {
            const opt = this.options[this.selectedIndex];
            document.getElementById("line_name").value = opt.value ? opt.text : "";
            const lineId = opt.value;
            const stockBox = document.getElementById("stockBox");
            
            if (lineId) {
                stockBox.style.display = "block";
                document.getElementById("stockContent").innerHTML = "<div class='col-12 text-muted'>กำลังโหลดข้อมูล...</div>";
                try {
                    const response = await fetch(SCRIPT_URL + "?action=getMedStock&line_id=" + lineId);
                    const result = await response.json();
                    document.getElementById("stockHeader").innerText = "📦 ปริมาณยาที่เหลือ (" + (result.totalSum || 0) + " เม็ด)";
                    if(result.list && result.list.length > 0) {
                        let html = "";
                        result.list.forEach((item, index) => {
                            html += `<div class="col-12 col-md-6 mb-2 text-secondary" style="font-size:0.95rem;">${index+1}. ${item.med_name} <span class="float-end fw-bold text-dark">${item.total_pills} เม็ด</span></div>`;
                        });
                        document.getElementById("stockContent").innerHTML = html;
                    } else {
                        document.getElementById("stockContent").innerHTML = "<div class='col-12 text-danger'>ไม่พบข้อมูลปริมาณยา</div>";
                    }
                } catch (error) {}
            } else { stockBox.style.display = "none"; }
        });

        function saveMedicine(event) {
            event.preventDefault();
            const morningList = extractMealData('morning');
            const lunchList = extractMealData('lunch');
            const dinnerList = extractMealData('dinner');
        
            const payload = {
                action: "saveMedicineDaily", // ใช้ชื่อแอคชั่นให้ตรงกับฟังก์ชันใน Apps Script
                line_id: document.getElementById("patientSelect").value,
                line_name: document.getElementById("line_name").value,
                
                // ยามื้อเช้า (เรียงล็อก Index 1 ถึง 5 เป๊ะๆ 100%)
                morning_med_1: morningList[0]?.name || "", morning_med_1_pills: morningList[0]?.pills !== undefined ? morningList[0]?.pills : "",
                morning_med_2: morningList[1]?.name || "", morning_med_2_pills: morningList[1]?.pills !== undefined ? morningList[1]?.pills : "",
                morning_med_3: morningList[2]?.name || "", morning_med_3_pills: morningList[2]?.pills !== undefined ? morningList[2]?.pills : "",
                morning_med_4: morningList[3]?.name || "", morning_med_4_pills: morningList[3]?.pills !== undefined ? morningList[3]?.pills : "",
                morning_med_5: morningList[4]?.name || "", morning_med_5_pills: morningList[4]?.pills !== undefined ? morningList[4]?.pills : "",
                
                // ยามื้อกลางวัน
                lunch_med_1: lunchList[0]?.name || "", lunch_med_1_pills: lunchList[0]?.pills !== undefined ? lunchList[0]?.pills : "",
                lunch_med_2: lunchList[1]?.name || "", lunch_med_2_pills: lunchList[1]?.pills !== undefined ? lunchList[1]?.pills : "",
                lunch_med_3: lunchList[2]?.name || "", lunch_med_3_pills: lunchList[2]?.pills !== undefined ? lunchList[2]?.pills : "",
                lunch_med_4: lunchList[3]?.name || "", lunch_med_4_pills: lunchList[3]?.pills !== undefined ? lunchList[3]?.pills : "",
                lunch_med_5: lunchList[4]?.name || "", lunch_med_5_pills: lunchList[4]?.pills !== undefined ? lunchList[4]?.pills : "",
                
                // ยามื้อเย็น
                dinner_med_1: dinnerList[0]?.name || "", dinner_med_1_pills: dinnerList[0]?.pills !== undefined ? dinnerList[0]?.pills : "",
                dinner_med_2: dinnerList[1]?.name || "", dinner_med_2_pills: dinnerList[1]?.pills !== undefined ? dinnerList[1]?.pills : "",
                dinner_med_3: dinnerList[2]?.name || "", dinner_med_3_pills: dinnerList[2]?.pills !== undefined ? dinnerList[2]?.pills : "",
                dinner_med_4: dinnerList[3]?.name || "", dinner_med_4_pills: dinnerList[3]?.pills !== undefined ? dinnerList[3]?.pills : "",
                dinner_med_5: dinnerList[4]?.name || "", dinner_med_5_pills: dinnerList[4]?.pills !== undefined ? dinnerList[4]?.pills : ""
            };
        
            Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
        
            // ปรับการส่ง Data ให้ Apps Script อ่านเป็น Parameter ได้ทันที
            const urlEncodedData = new URLSearchParams(payload).toString();

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: urlEncodedData
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 2000, showConfirmButton: false });
                    document.getElementById("medicineForm").reset();
                    document.getElementById("stockBox").style.display = "none";
                    document.getElementById("morningMedContainer").innerHTML = "";
                    document.getElementById("lunchMedContainer").innerHTML = "";
                    document.getElementById("dinnerMedContainer").innerHTML = "";
                    addMedRow('morning'); addMedRow('lunch'); addMedRow('dinner');
                } else { Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: data.message }); }
            }).catch(error => { Swal.fire({ icon: 'error', title: 'การเชื่อมต่อขัดข้อง' }); });
        }

        window.onload = function() { loadPatients(); loadMedicineList(); };

        function goBackMain() {
            window.location.href = 'https://liff.line.me/2009966517-pPEyRumg';
        }
        
    </script>
</body>
</html>
